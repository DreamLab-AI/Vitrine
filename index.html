<!doctype html>
<html lang="en">
<head>

  <title>Vitrine — From video to a living 3D world</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">

  <style>
    :root { --r-background-color:#0a1626; }

    .reveal .slides section { padding:0; }
    .corner { position:fixed; right:12px; bottom:10px; z-index:40; font:600 12px/1 Inter,Arial,sans-serif;

    .corner:hover { opacity:1; color:#2fd4e8; }
    .reveal .slide-number { background:transparent; color:#5e7a93; font-size:13px; }

  <a class="corner" href="tech/">Technical version →</a>

  <script>
    Reveal.initialize({
      hash: true, slideNumber: 'c/t', transition: 'fade', controls: true,
      width: 1920, height: 1080, margin: 0
    });
